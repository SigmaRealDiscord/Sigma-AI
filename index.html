<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101323">
  <title>Sigma AI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#26345f 0,#101323 55%);color:#f5f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(680px,90%);text-align:center;padding:56px 28px;border:1px solid #ffffff20;border-radius:24px;background:#ffffff09;backdrop-filter:blur(12px)}
    .logo{width:72px;height:72px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#6d8cff,#9b65ff);font-size:34px;font-weight:800}
    h1{font-size:clamp(2.4rem,8vw,4.5rem);margin:0;letter-spacing:-.06em}p{color:#b9c2df;line-height:1.7;font-size:1.05rem}.tag{display:inline-block;margin-top:18px;padding:9px 15px;border:1px solid #879cff66;border-radius:999px;color:#cbd5ff;font-size:.9rem}
    footer{margin-top:34px;color:#7f89a8;font-size:.82rem}
  </style>
</head>
<body>
  <main>
    <div class="logo">Σ</div>
    <h1>Sigma AI</h1>
    <p>Your AI project is taking shape.<br>One place for intelligent tools, conversations, and future innovations.</p>
    <span class="tag">Official project website · Coming soon</span>
    <footer>© <span id="year"></span> Sigma AI</footer>
  </main>
  <script>document.getElementById('year').textContent=new Date().getFullYear()</script>
</body>
</html>
